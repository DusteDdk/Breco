name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --build-config Release --output-on-failure
          $ctestExitCode = $LASTEXITCODE
          if ($ctestExitCode -ne 0 -and (Test-Path build/breco_ui_integration_tests.txt)) {
            Get-Content build/breco_ui_integration_tests.txt
          }
          exit $ctestExitCode

      - name: Install
        run: cmake --install build --prefix dist/breco-windows-x86_64

      - name: Deploy Qt runtime
        run: >-
          windeployqt
          --release
          --no-translations
          --compiler-runtime
          dist/breco-windows-x86_64/bin/breco.exe
          dist/breco-windows-x86_64/bin/brecodump.exe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: breco-windows-x86_64-${{ github.sha }}
          path: dist/breco-windows-x86_64
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-image-formats-plugins \
            libqt6svg6

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix dist/breco-linux-x86_64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: breco-linux-x86_64-${{ github.sha }}
          path: dist/breco-linux-x86_64
          if-no-files-found: error
